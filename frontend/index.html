<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="96x96" href="/favicon-96.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no" />
    <title>Spidercrab</title>

    <!-- Installable / full-screen on iOS home screen (no App Store, no cost) -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Spidercrab" />
    <meta name="theme-color" content="#FDF6E3" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#2D353B" media="(prefers-color-scheme: dark)" />
    <!-- Inter font from Google Fonts CDN -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=Inter:ital,wght@0,400;0,600;1,400&family=Inter+Mono:wght@400;600&display=swap"
      rel="stylesheet"
    />
    <script>
      // Prevent flash of light theme when dark mode is preferred
      (function() {
        var theme = null;
        try { theme = localStorage.getItem('spidercrab-theme'); } catch(e) {}
        if (theme === 'dark' || (theme !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
          document.documentElement.classList.add('dark');
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
