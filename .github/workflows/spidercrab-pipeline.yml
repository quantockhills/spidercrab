name: Spidercrab Pipeline Orchestrator

on:
  workflow_dispatch:
  issues:
    types:
      - labeled
      - unlabeled
      - closed
      - reopened
      - opened

jobs:
  pipeline-stage:
    # This workflow implements the spidercrab pipeline stages
    # It's triggered by issue label changes and enforces proper stage progression
    runs-on: ubuntu-latest
    steps:
      - name: Check for active:true label
        id: check-label
        uses: actions/github-script@v7
        with:
          script: |
            const issue = context.payload.issue;
            const hasActiveLabel = issue.labels.some(l => l.name === 'active:true');
            core.setOutput('has_active_label', hasActiveLabel);
            core.setOutput('issue_number', issue.number);
            core.setOutput('issue_title', issue.title);
            core.setOutput('issue_body', issue.body);
            core.setOutput('stage_labels', issue.labels.filter(l => l.name.startsWith('stage:')).map(l => l.name).join(','));
            
      - name: Initialize pipeline for new active:true issues
        if: github.event.action == 'labeled' && github.event.label.name == 'active:true' && steps.check-label.outputs.has_active_label == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const issueNumber = context.payload.issue.number;
            const issue = context.payload.issue;
            const body = issue.body || '';
            
            // Determine effort level
            const hasEasyLabel = issue.labels.some(l => l.name === 'effort:easy');
            const hasHardLabel = issue.labels.some(l => l.name === 'effort:hard');
            
            let effort = 'unknown';
            if (hasEasyLabel) effort = 'easy';
            else if (hasHardLabel) effort = 'hard';
            else {
              // Default to hard for UI features, easy for non-UI
              if (body.toLowerCase().includes('UI') || body.toLowerCase().includes('screenshot') || body.toLowerCase().includes('GUI')) {
                effort = 'hard';
              } else {
                effort = 'easy';
              }
            }
            
            // Add effort label if not present
            if (effort !== 'unknown') {
              await github.rest.issues.addLabels({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issueNumber,
                labels: [`effort:${effort}`]
              });
            }
            
            // Add stage:builder label
            await github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber,
              labels: ['stage:builder']
            });
            
            // Add needs-verification for UI features
            if (effort === 'hard' && (body.toLowerCase().includes('UI') || body.toLowerCase().includes('screenshot') || body.toLowerCase().includes('GUI'))) {
              await github.rest.issues.addLabels({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issueNumber,
                labels: ['needs-verification']
              });
            }
            
      - name: Skip if no active:true label
        if: steps.check-label.outputs.has_active_label != 'true'
        run: |
          echo "No active:true label, skipping pipeline"
          
      - name: Determine effort level
        id: effort
        uses: actions/github-script@v7
        with:
          script: |
            const issue = context.payload.issue;
            const body = issue.body || '';
            const hasEasyLabel = issue.labels.some(l => l.name === 'effort:easy');
            const hasHardLabel = issue.labels.some(l => l.name === 'effort:hard');
            
            let effort = 'unknown';
            if (hasEasyLabel) effort = 'easy';
            else if (hasHardLabel) effort = 'hard';
            else {
              // Default to hard for UI features, easy for non-UI
              if (body.toLowerCase().includes('UI') || body.toLowerCase().includes('screenshot')) {
                effort = 'hard';
              } else {
                effort = 'easy';
              }
            }
            core.setOutput('effort', effort);
            
      - name: Comment plan for hard effort issues
        if: steps.effort.outputs.effort == 'hard'
        uses: actions/github-script@v7
        with:
          script: |
            const issueNumber = context.payload.issue.number;
            const planComment = `## Plan: Fix Autonomous Worker Pipeline\n\n**Problem:** The worker closes issues without running full pipeline (Reviewer, Screenshot Verifier).\n\n**Solution approach:**\n1. Modify worker prompt to require explicit stage progression\n2. Add verification step before closing\n3. Add "needs-verification" label gate for UI features\n\n**Implementation stages:**\n- **Builder:** Update worker prompt in \`.github/WORKER_PROMPT.md\` to enforce pipeline stages\n- **Reviewer:** Verify the prompt changes work correctly\n- **Tester:** Run existing tests to ensure nothing breaks\n\n**Effort:** hard (requires code changes + testing)`;
            
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber,
              body: planComment
            });
            
      - name: Comment plan for easy effort issues
        if: steps.effort.outputs.effort == 'easy'
        uses: actions/github-script@v7
        with:
          script: |
            const issueNumber = context.payload.issue.number;
            const planComment = `## Plan: Implement Feature\n\n**Implementation:**\n1. Build the feature\n2. Add tests if applicable\n3. Close issue when done\n\n**Effort:** easy`;
            
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber,
              body: planComment
            });
            
      - name: Advance to stage:reviewer when builder comments
        if: github.event_name == 'issues' && github.event.action == 'commented'
        uses: actions/github-script@v7
        with:
          script: |
            const issueNumber = context.payload.issue.number;
            const comment = context.payload.comment.body;
            const issue = context.payload.issue;
            
            // Check if comment indicates builder completion
            const builderKeywords = ['implementation complete', 'build finished', 'builder done', 'ready for review', 'implementation verified'];
            const isBuilderComplete = builderKeywords.some(kw => comment.toLowerCase().includes(kw));
            
            const hasBuilderStage = issue.labels.some(l => l.name === 'stage:builder');
            const hasReviewerStage = issue.labels.some(l => l.name === 'stage:reviewer');
            const hasHardEffort = issue.labels.some(l => l.name === 'effort:hard');
            
            // For hard issues: builder must complete before reviewer
            if (isBuilderComplete && hasBuilderStage && !hasReviewerStage) {
              await github.rest.issues.removeLabel({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issueNumber,
                name: 'stage:builder'
              });
              await github.rest.issues.addLabels({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issueNumber,
                labels: ['stage:reviewer']
              });
            }
            
      - name: Advance to stage:tester or screenshot when reviewer comments
        if: github.event_name == 'issues' && github.event.action == 'commented'
        uses: actions/github-script@v7
        with:
          script: |
            const issueNumber = context.payload.issue.number;
            const comment = context.payload.comment.body;
            const issue = context.payload.issue;
            
            // Check if comment indicates reviewer completion
            const reviewerKeywords = ['review complete', 'verified and approved', 'code looks good', 'no issues found', 'ready for testing'];
            const isReviewerComplete = reviewerKeywords.some(kw => comment.toLowerCase().includes(kw));
            
            const hasReviewerStage = issue.labels.some(l => l.name === 'stage:reviewer');
            const hasTesterStage = issue.labels.some(l => l.name === 'stage:tester');
            const hasScreenshotStage = issue.labels.some(l => l.name === 'stage:screenshot');
            const hasHardEffort = issue.labels.some(l => l.name === 'effort:hard');
            const body = issue.body || '';
            
            // For hard issues: reviewer must complete before tester/screenshot
            if (isReviewerComplete && hasReviewerStage && !hasTesterStage && !hasScreenshotStage) {
              await github.rest.issues.removeLabel({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issueNumber,
                name: 'stage:reviewer'
              });
              
              // Determine if UI feature (needs screenshot) or backend (goes to tester)
              if (body.toLowerCase().includes('UI') || body.toLowerCase().includes('screenshot') || body.toLowerCase().includes('GUI')) {
                await github.rest.issues.addLabels({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: issueNumber,
                  labels: ['stage:screenshot']
                });
              } else {
                await github.rest.issues.addLabels({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: issueNumber,
                  labels: ['stage:tester']
                });
              }
            }
            
      - name: Enforce pipeline stage progression for closing
        if: github.event.action == 'closed'
        uses: actions/github-script@v7
        with:
          script: |
            const issueNumber = context.payload.issue.number;
            const issue = context.payload.issue;
            
            // Check if issue has active:true label - if so, it was closed without proper pipeline
            const hasActiveLabel = issue.labels.some(l => l.name === 'active:true');
            const hasAnyStageLabel = issue.labels.some(l => l.name.startsWith('stage:'));
            const hasHardLabel = issue.labels.some(l => l.name === 'effort:hard');
            
            if (hasActiveLabel) {
              // Reopen the issue and add a comment explaining the pipeline violation
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issueNumber,
                body: '## Pipeline Violation Detected\n\nThe issue was closed while still having the `active:true` label. This indicates the pipeline was not followed correctly.\n\n**Required action:** Remove `active:true` label before closing, ensuring all stages (Builder → Reviewer → Tester) complete successfully.'
              });
              
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issueNumber,
                state: 'open'
              });
              
              core.setFailed('Issue closed without completing pipeline - reopened');
            }
            
            // For hard issues, check that all stages completed
            if (hasHardLabel) {
              const hasBuilderStage = issue.labels.some(l => l.name === 'stage:builder');
              const hasReviewerStage = issue.labels.some(l => l.name === 'stage:reviewer');
              const hasTesterStage = issue.labels.some(l => l.name === 'stage:tester');
              const hasScreenshotStage = issue.labels.some(l => l.name === 'stage:screenshot');
              
              // Hard issues must have gone through all stages
              if (hasBuilderStage || hasReviewerStage || hasScreenshotStage) {
                core.setFailed('Hard issue closed before pipeline completion - stages remaining');
              }
            }
            
      - name: Remove active:true and stage labels when issue is closed properly
        if: github.event.action == 'closed' && !steps.check-label.outputs.has_active_label
        uses: actions/github-script@v7
        with:
          script: |
            const issueNumber = context.payload.issue.number;
            // Remove active:true label when issue is closed
            try {
              await github.rest.issues.removeLabel({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issueNumber,
                name: 'active:true'
              });
            } catch (e) {
              // Label might already be removed
              console.log('Label already removed or not found');
            }
            
            // Remove all stage labels
            const stageLabels = ['stage:builder', 'stage:reviewer', 'stage:tester', 'stage:screenshot'];
            for (const label of stageLabels) {
              try {
                await github.rest.issues.removeLabel({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: issueNumber,
                  name: label
                });
              } catch (e) {
                // Label might not exist
              }
            }
            
            // Remove needs-verification if present
            try {
              await github.rest.issues.removeLabel({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issueNumber,
                name: 'needs-verification'
              });
            } catch (e) {
              // Label might not exist
            }