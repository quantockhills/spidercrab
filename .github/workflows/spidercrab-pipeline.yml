name: Spidercrab Pipeline Orchestrator

on:
  workflow_dispatch:
  issues:
    types:
      - labeled
      - unlabeled
      - closed
      - reopened

jobs:
  pipeline-stage:
    # This workflow implements the spidercrab pipeline stages
    # It's triggered by issue label changes and enforces proper stage progression
    runs-on: ubuntu-latest
    steps:
      - name: Check for active:true label
        id: check-label
        uses: actions/github-script@v7
        with:
          script: |
            const issue = context.payload.issue;
            const hasActiveLabel = issue.labels.some(l => l.name === 'active:true');
            core.setOutput('has_active_label', hasActiveLabel);
            core.setOutput('issue_number', issue.number);
            core.setOutput('issue_title', issue.title);
            core.setOutput('issue_body', issue.body);
            
      - name: Add stage:builder label when active:true is added
        if: github.event.action == 'labeled' && github.event.label.name == 'active:true' && steps.check-label.outputs.has_active_label == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const issueNumber = context.payload.issue.number;
            await github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber,
              labels: ['stage:builder']
            });
            
      - name: Skip if no active:true label
        if: steps.check-label.outputs.has_active_label != 'true'
        run: |
          echo "No active:true label, skipping pipeline"
          
      - name: Determine effort level
        id: effort
        uses: actions/github-script@v7
        with:
          script: |
            const issue = context.payload.issue;
            const body = issue.body || '';
            const hasEasyLabel = issue.labels.some(l => l.name === 'effort:easy');
            const hasHardLabel = issue.labels.some(l => l.name === 'effort:hard');
            
            let effort = 'unknown';
            if (hasEasyLabel) effort = 'easy';
            else if (hasHardLabel) effort = 'hard';
            else {
              // Default to hard for UI features, easy for non-UI
              if (body.toLowerCase().includes('UI') || body.toLowerCase().includes('screenshot')) {
                effort = 'hard';
              } else {
                effort = 'easy';
              }
            }
            core.setOutput('effort', effort);
            
      - name: Comment plan for hard effort issues
        if: steps.effort.outputs.effort == 'hard'
        uses: actions/github-script@v7
        with:
          script: |
            const issueNumber = context.payload.issue.number;
            const planComment = `## Plan: Fix Autonomous Worker Pipeline

**Problem:** The worker closes issues without running full pipeline (Reviewer, Screenshot Verifier).

**Solution approach:**
1. Modify worker prompt to require explicit stage progression
2. Add verification step before closing
3. Add "needs-verification" label gate for UI features

**Implementation stages:**
- **Builder:** Update worker prompt in \`.github/workflow/\` to enforce pipeline stages
- **Reviewer:** Verify the prompt changes work correctly
- **Tester:** Run existing tests to ensure nothing breaks

**Effort:** hard (requires code changes + testing)`;
            
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber,
              body: planComment
            });
            
      - name: Comment plan for easy effort issues
        if: steps.effort.outputs.effort == 'easy'
        uses: actions/github-script@v7
        with:
          script: |
            const issueNumber = context.payload.issue.number;
            const planComment = `## Plan: Implement Feature

**Implementation:**
1. Build the feature
2. Add tests if applicable
3. Close issue when done

**Effort:** easy`;
            
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber,
              body: planComment
            });
            
      - name: Add needs-verification label for UI features
        if: steps.effort.outputs.effort == 'hard'
        uses: actions/github-script@v7
        with:
          script: |
            const issueNumber = context.payload.issue.number;
            const issue = context.payload.issue;
            const body = issue.body || '';
            
            // Add needs-verification label for UI features
            if (body.toLowerCase().includes('UI') || body.toLowerCase().includes('screenshot') || body.toLowerCase().includes('GUI')) {
              await github.rest.issues.addLabels({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issueNumber,
                labels: ['needs-verification']
              });
            }

      - name: Advance to stage:reviewer when builder comments
        if: github.event_name == 'issues' && github.event.action == 'commented'
        uses: actions/github-script@v7
        with:
          script: |
            const issueNumber = context.payload.issue.number;
            const comment = context.payload.comment.body;
            const issue = context.payload.issue;
            
            // Check if comment indicates builder completion
            const builderKeywords = ['implementation complete', 'build finished', 'builder done', 'ready for review'];
            const isBuilderComplete = builderKeywords.some(kw => comment.toLowerCase().includes(kw));
            
            if (isBuilderComplete && issue.labels.some(l => l.name === 'stage:builder')) {
              await github.rest.issues.removeLabel({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issueNumber,
                name: 'stage:builder'
              });
              await github.rest.issues.addLabels({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issueNumber,
                labels: ['stage:reviewer']
              });
            }

      - name: Enforce pipeline stage progression for closing
        if: github.event.action == 'closed'
        uses: actions/github-script@v7
        with:
          script: |
            const issueNumber = context.payload.issue.number;
            const issue = context.payload.issue;
            
            // Check if issue has active:true label - if so, it was closed without proper pipeline
            const hasActiveLabel = issue.labels.some(l => l.name === 'active:true');
            const hasAnyStageLabel = issue.labels.some(l => l.name.startsWith('stage:'));
            
            if (hasActiveLabel) {
              // Reopen the issue and add a comment explaining the pipeline violation
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issueNumber,
                body: '## Pipeline Violation Detected\n\nThe issue was closed while still having the `active:true` label. This indicates the pipeline was not followed correctly.\n\n**Required action:** Remove `active:true` label before closing, ensuring all stages (Builder → Reviewer → Tester) complete successfully.'
              });
              
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issueNumber,
                state: 'open'
              });
              
              core.setFailed('Issue closed without completing pipeline - reopened');
            }
            
            // For hard issues, check that stage labels were used
            const hasHardLabel = issue.labels.some(l => l.name === 'effort:hard');
            if (hasHardLabel && hasAnyStageLabel) {
              core.setFailed('Issue has stage labels but was closed - pipeline not completed');
            }
            
      - name: Remove active:true when issue is closed properly
        if: github.event.action == 'closed' && !steps.check-label.outputs.has_active_label
        uses: actions/github-script@v7
        with:
          script: |
            const issueNumber = context.payload.issue.number;
            // Remove active:true label when issue is closed
            try {
              await github.rest.issues.removeLabel({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issueNumber,
                name: 'active:true'
              });
            } catch (e) {
              // Label might already be removed
              console.log('Label already removed or not found');
            }