name: Windows Build & Test

on:
  push:
    branches: [master, feat/windows-cross-compile, feat/clip-launcher-playtime]
  pull_request:
    branches: [master]
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: windows-2022
    defaults:
      run:
        shell: powershell
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup MSVC + LLVM
        uses: ilammy/setup-msvc-dev-cmd@v1

      - name: Install LLVM (clang-cl)
        run: choco install llvm -y --version=19.1.7
      
      - name: Add LLVM to PATH
        run: echo "C:\Program Files\LLVM\bin" | Out-File -Append -FilePath $env:GITHUB_PATH

      - name: Fix VCVARS path for Claude's script
        run: |
          $find = "C:\Program Files (x86)\Microsoft Visual Studio\2022\BuildTools"
          $replace = (Get-ChildItem "C:\Program Files\Microsoft Visual Studio\2022" -Directory | Select-Object -First 1).FullName
          (Get-Content extension\test\deploy_and_test.ps1) -replace [regex]::Escape($find), $replace | Set-Content extension\test\deploy_and_test.ps1
          Write-Host "VCVARS path patched: $replace"

      - name: Download REAPER portable
        run: |
          curl -L -o reaper-install.exe "https://www.reaper.fm/files/7.x/reaper7xx_x64-install.exe"
          reaper-install.exe /S /PORTABLE /D="${{ github.workspace }}\extension\test"

      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Build DLL & Deploy
        working-directory: extension\test
        run: ./deploy_and_test.ps1 -DeployOnly -SkipFrontend

      - name: Run Integration Tests
        working-directory: extension\test
        run: ./deploy_and_test.ps1 -TestOnly

      - name: Stop REAPER
        if: always()
        run: Get-Process "reaper" -ErrorAction SilentlyContinue | Stop-Process -Force
