name: Windows Build & Test

on:
  push:
    branches: [master, feat/windows-cross-compile, feat/clip-launcher-playtime]
  pull_request:
    branches: [master]
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: windows-2022
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download REAPER portable
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://www.reaper.fm/files/7.x/reaper7xx_x64-install.exe" -OutFile reaper-install.exe
          Start-Process reaper-install.exe -ArgumentList "/S","/PORTABLE","/D=${{ github.workspace }}\extension\test" -Wait

      - name: Build & Deploy DLL
        shell: pwsh
        working-directory: extension/test
        run: |
          # Claude's deploy_and_test.ps1 expects clang-cl with vcvars env
          # GitHub runners have VS 2022; fix the path if needed
          $vsPath = (Get-ChildItem "C:\Program Files\Microsoft Visual Studio\2022" -Directory | Select-Object -First 1).FullName
          $vcvars = "$vsPath\VC\Auxiliary\Build\vcvarsall.bat"
          if (-not (Test-Path $vcvars)) {
            $vcvars = "C:\Program Files (x86)\Microsoft Visual Studio\2022\BuildTools\VC\Auxiliary\Build\vcvarsall.bat"
          }
          # Install LLVM if missing
          if (-not (Get-Command clang-cl -ErrorAction SilentlyContinue)) {
            choco install llvm -y --version=19.1.7
          }
          # Run Claude's script with correct VCVARS
          $env:VCVARS_OVERRIDE = $vcvars
          (Get-Content deploy_and_test.ps1) -replace 'C:\\Program Files \(x86\)\\Microsoft Visual Studio\\2022\\BuildTools\\VC\\Auxiliary\\Build\\vcvarsall\.bat', $vcvars | Set-Content deploy_and_test.ps1
          ./deploy_and_test.ps1 -DeployOnly -SkipFrontend

      - name: Run Integration Tests
        shell: pwsh
        working-directory: extension/test
        run: ./deploy_and_test.ps1 -TestOnly

      - name: Stop REAPER
        if: always()
        shell: pwsh
        run: Get-Process "reaper" -ErrorAction SilentlyContinue | Stop-Process -Force
