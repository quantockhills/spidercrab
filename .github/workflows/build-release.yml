name: build-release

# Manual only — trigger from the Actions tab. Builds the extension DLL, the
# web UI, and (optionally) the Windows installer, and uploads them as
# downloadable artifacts. Does NOT run on push.
on:
  workflow_dispatch:
    inputs:
      make_installer:
        description: "Also build the Windows installer (SpidercrabSetup.exe)"
        type: boolean
        default: true

jobs:
  windows:
    # Pinned (not windows-latest) so the toolchain doesn't shift under us;
    # matches the existing windows-build.yml runner.
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive   # pulls WDL + REAPER SDK (docs/WDL, docs/reaper-sdk)

      # ---- Web UI ----
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build

      # ---- Toolchain: clang-cl inside the MSVC environment (never MinGW) ----
      # The runner image ships LLVM at C:\Program Files\LLVM; we reference
      # clang-cl by absolute path rather than relying on PATH propagation.
      # Ninja comes from chocolatey (its bin dir is already on PATH).
      - name: Install Ninja
        run: choco install ninja -y --no-progress
      - name: Set up MSVC environment (Windows SDK + CRT for clang-cl)
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Resolve clang-cl
        id: clang
        shell: pwsh
        run: |
          $c = "C:\Program Files\LLVM\bin\clang-cl.exe"
          if (-not (Test-Path $c)) {
            choco install llvm -y --no-progress
          }
          if (-not (Test-Path $c)) { throw "clang-cl.exe not found at $c" }
          "path=$c" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          & $c --version

      # Uses the same build dir + absolute compiler path as the verified local build.
      - name: Build extension DLL (CMake + Ninja + clang-cl)
        working-directory: extension
        shell: pwsh
        run: |
          $cc = "${{ steps.clang.outputs.path }}"
          cmake -S . -B build-cmake -G Ninja `
            -DCMAKE_BUILD_TYPE=RelWithDebInfo `
            -DSPIDERCRAB_BUILD_TESTS=OFF `
            -DCMAKE_C_COMPILER="$cc" `
            -DCMAKE_CXX_COMPILER="$cc"
          cmake --build build-cmake --target reaper-spidercrab

      - name: Locate built DLL
        id: dll
        shell: pwsh
        run: |
          $dll = Get-ChildItem extension -Recurse -Filter reaper_spidercrab.dll -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $dll) { throw "reaper_spidercrab.dll not found after build" }
          "path=$($dll.FullName)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "dir=$($dll.DirectoryName)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          Write-Host "DLL: $($dll.FullName)"

      # ---- Stage a clean drop-in bundle: reaper_spidercrab.dll + frontend/ ----
      # (This is both the manual-install download AND the installer's payload.)
      - name: Stage install bundle
        shell: pwsh
        run: |
          $stage = "installer\payload"
          New-Item -ItemType Directory "$stage\frontend" -Force | Out-Null
          Copy-Item "${{ steps.dll.outputs.path }}" "$stage\reaper_spidercrab.dll" -Force
          Copy-Item "frontend\dist\*" "$stage\frontend\" -Recurse -Force

      # ---- Installer (optional) ----
      - name: Build Windows installer
        if: ${{ inputs.make_installer }}
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          # Look in the standard Inno Setup locations (any major version) rather
          # than recursing all of Program Files, which is slow on the runner.
          $iscc = Get-ChildItem "${env:ProgramFiles(x86)}\Inno Setup*","$env:ProgramFiles\Inno Setup*" `
                    -Filter ISCC.exe -Recurse -Depth 1 -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $iscc) { throw "ISCC.exe not found after installing Inno Setup" }
          Write-Host "ISCC: $($iscc.FullName)"
          & $iscc.FullName installer\spidercrab.iss
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup compile failed ($LASTEXITCODE)" }

      # ---- Publish downloadable artifacts (each is a separate download) ----
      - name: Upload installer
        if: ${{ inputs.make_installer }}
        uses: actions/upload-artifact@v4
        with:
          name: SpidercrabSetup
          path: installer/output/SpidercrabSetup.exe

      - name: Upload manual-install bundle (DLL + frontend, drop into UserPlugins)
        uses: actions/upload-artifact@v4
        with:
          name: spidercrab-manual
          path: installer/payload/**

      - name: Upload debug symbols (PDB)
        uses: actions/upload-artifact@v4
        with:
          name: spidercrab-debug-symbols
          path: ${{ steps.dll.outputs.dir }}/reaper_spidercrab.pdb
          if-no-files-found: ignore

  macos:
    # Pinned (not macos-latest) so the toolchain doesn't shift under us.
    # macos-14 is mid-deprecation (began 2026-07-06, gone 2026-11-02) — use 15.
    # Apple Silicon (arm64), matching current Macs.
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive   # pulls WDL + REAPER SDK (docs/WDL, docs/reaper-sdk)

      # Xcode Command Line Tools (clang++, the Frameworks) ship on the runner
      # image already — no toolchain install needed, unlike Windows.
      - name: Build extension dylib (CMake + clang++)
        working-directory: extension
        run: |
          cmake -S . -B build-cmake \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DSPIDERCRAB_BUILD_TESTS=OFF
          cmake --build build-cmake --target reaper-spidercrab --parallel

      - name: Locate + verify the built dylib
        id: dylib
        run: |
          # Search all of extension/, not just build-cmake/: on macOS a .dylib
          # is a CMake LIBRARY artifact, so the project's hardcoded
          # LIBRARY_OUTPUT_DIRECTORY (extension/build/, matching build.sh's
          # output convention) applies here, unlike on Windows where a .dll is
          # a RUNTIME artifact and that setting is ignored.
          DYLIB=$(find . -name reaper_spidercrab.dylib | head -1)
          if [ -z "$DYLIB" ]; then echo "reaper_spidercrab.dylib not found after build"; exit 1; fi
          echo "path=extension/${DYLIB#./}" >> "$GITHUB_OUTPUT"
          file "$DYLIB"
          # Confirm the REAPER entry point is actually exported.
          nm -gU "$DYLIB" | grep -q ReaperPluginEntry || { echo "ReaperPluginEntry not exported"; exit 1; }
        working-directory: extension

      - name: Ad-hoc codesign
        run: codesign --force --deep --sign - "${{ steps.dylib.outputs.path }}"

      - uses: actions/upload-artifact@v4
        with:
          name: spidercrab-macos
          path: ${{ steps.dylib.outputs.path }}
