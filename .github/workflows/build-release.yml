name: build-release

# Manual only — trigger from the Actions tab. Builds the extension DLL, the
# web UI, and (optionally) the Windows installer, and uploads them as
# downloadable artifacts. Does NOT run on push.
on:
  workflow_dispatch:
    inputs:
      make_installer:
        description: "Also build the installers (SpidercrabSetup.exe, SpidercrabInstaller.pkg)"
        type: boolean
        default: true

jobs:
  windows:
    # Pinned (not windows-latest) so the toolchain doesn't shift under us;
    # matches the existing windows-build.yml runner.
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive   # pulls WDL + REAPER SDK (docs/WDL, docs/reaper-sdk)

      # ---- Web UI ----
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build

      # ---- Toolchain: clang-cl inside the MSVC environment (never MinGW) ----
      # The runner image ships LLVM at C:\Program Files\LLVM; we reference
      # clang-cl by absolute path rather than relying on PATH propagation.
      # Ninja comes from chocolatey (its bin dir is already on PATH).
      - name: Install Ninja
        run: choco install ninja -y --no-progress
      - name: Set up MSVC environment (Windows SDK + CRT for clang-cl)
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Resolve clang-cl
        id: clang
        shell: pwsh
        run: |
          $c = "C:\Program Files\LLVM\bin\clang-cl.exe"
          if (-not (Test-Path $c)) {
            choco install llvm -y --no-progress
          }
          if (-not (Test-Path $c)) { throw "clang-cl.exe not found at $c" }
          "path=$c" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          & $c --version

      # Uses the same build dir + absolute compiler path as the verified local build.
      - name: Build extension DLL (CMake + Ninja + clang-cl)
        working-directory: extension
        shell: pwsh
        run: |
          $cc = "${{ steps.clang.outputs.path }}"
          cmake -S . -B build-cmake -G Ninja `
            -DCMAKE_BUILD_TYPE=RelWithDebInfo `
            -DSPIDERCRAB_BUILD_TESTS=OFF `
            -DCMAKE_C_COMPILER="$cc" `
            -DCMAKE_CXX_COMPILER="$cc"
          cmake --build build-cmake --target reaper-spidercrab

      - name: Locate built DLL
        id: dll
        shell: pwsh
        run: |
          $dll = Get-ChildItem extension -Recurse -Filter reaper_spidercrab.dll -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $dll) { throw "reaper_spidercrab.dll not found after build" }
          "path=$($dll.FullName)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "dir=$($dll.DirectoryName)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          Write-Host "DLL: $($dll.FullName)"

      # ---- Stage a clean drop-in bundle: reaper_spidercrab.dll + frontend/ ----
      # (This is both the manual-install download AND the installer's payload.)
      - name: Stage install bundle
        shell: pwsh
        run: |
          $stage = "installer\payload"
          New-Item -ItemType Directory "$stage\frontend" -Force | Out-Null
          Copy-Item "${{ steps.dll.outputs.path }}" "$stage\reaper_spidercrab.dll" -Force
          Copy-Item "frontend\dist\*" "$stage\frontend\" -Recurse -Force

      # ---- Installer (optional) ----
      - name: Build Windows installer
        if: ${{ inputs.make_installer }}
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          # Look in the standard Inno Setup locations (any major version) rather
          # than recursing all of Program Files, which is slow on the runner.
          $iscc = Get-ChildItem "${env:ProgramFiles(x86)}\Inno Setup*","$env:ProgramFiles\Inno Setup*" `
                    -Filter ISCC.exe -Recurse -Depth 1 -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $iscc) { throw "ISCC.exe not found after installing Inno Setup" }
          Write-Host "ISCC: $($iscc.FullName)"
          & $iscc.FullName installer\spidercrab.iss
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup compile failed ($LASTEXITCODE)" }

      # ---- Publish downloadable artifacts (each is a separate download) ----
      - name: Upload installer
        if: ${{ inputs.make_installer }}
        uses: actions/upload-artifact@v4
        with:
          name: SpidercrabSetup
          path: installer/output/SpidercrabSetup.exe

      - name: Upload manual-install bundle (DLL + frontend, drop into UserPlugins)
        uses: actions/upload-artifact@v4
        with:
          name: spidercrab-manual
          path: installer/payload/**

      - name: Upload debug symbols (PDB)
        uses: actions/upload-artifact@v4
        with:
          name: spidercrab-debug-symbols
          path: ${{ steps.dll.outputs.dir }}/reaper_spidercrab.pdb
          if-no-files-found: ignore

  macos:
    # Pinned (not macos-latest) so the toolchain doesn't shift under us.
    # macos-14 is mid-deprecation (began 2026-07-06, gone 2026-11-02) — use 15.
    # Apple Silicon (arm64), matching current Macs.
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive   # pulls WDL + REAPER SDK (docs/WDL, docs/reaper-sdk)

      # ---- Web UI ----
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build

      # Xcode Command Line Tools (clang++, the Frameworks) ship on the runner
      # image already — no toolchain install needed, unlike Windows.
      - name: Build extension dylib (CMake + clang++)
        working-directory: extension
        run: |
          cmake -S . -B build-cmake \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DSPIDERCRAB_BUILD_TESTS=OFF
          cmake --build build-cmake --target reaper-spidercrab --parallel

      - name: Locate + verify the built dylib
        id: dylib
        run: |
          # Search all of extension/, not just build-cmake/: on macOS a .dylib
          # is a CMake LIBRARY artifact, so the project's hardcoded
          # LIBRARY_OUTPUT_DIRECTORY (extension/build/, matching build.sh's
          # output convention) applies here, unlike on Windows where a .dll is
          # a RUNTIME artifact and that setting is ignored.
          DYLIB=$(find . -name reaper_spidercrab.dylib | head -1)
          if [ -z "$DYLIB" ]; then echo "reaper_spidercrab.dylib not found after build"; exit 1; fi
          echo "path=extension/${DYLIB#./}" >> "$GITHUB_OUTPUT"
          file "$DYLIB"
          # Confirm the REAPER entry point is actually exported.
          nm -gU "$DYLIB" | grep -q ReaperPluginEntry || { echo "ReaperPluginEntry not exported"; exit 1; }
        working-directory: extension

      - name: Ad-hoc codesign
        run: codesign --force --deep --sign - "${{ steps.dylib.outputs.path }}"

      # ---- Stage a clean drop-in bundle: reaper_spidercrab.dylib + frontend/ ----
      # (This is both the manual-install download AND the installer's payload.)
      - name: Stage install bundle
        run: |
          stage="installer-mac/payload"
          mkdir -p "$stage/frontend"
          cp "${{ steps.dylib.outputs.path }}" "$stage/reaper_spidercrab.dylib"
          cp -R frontend/dist/. "$stage/frontend/"

      - uses: actions/upload-artifact@v4
        with:
          name: spidercrab-macos
          path: ${{ steps.dylib.outputs.path }}

      - name: Upload manual-install bundle (dylib + frontend, drop into UserPlugins)
        uses: actions/upload-artifact@v4
        with:
          name: spidercrab-macos-manual
          path: installer-mac/payload/**

      # ---- Installer (optional) ----
      - name: Build macOS installer (.pkg)
        if: ${{ inputs.make_installer }}
        run: |
          version="$(git describe --tags --always 2>/dev/null || echo 0.0.0)"
          # Payload-free package: postinstall + the staged dylib/frontend
          # travel together as the package's "Scripts" bundle (see
          # installer-mac/README.md for why — there's no fixed, admin-free
          # install location to expand "the current user's home" into at
          # build time, only at install time, inside the script).
          scripts_dir="installer-mac/build-scripts"
          rm -rf "$scripts_dir"
          mkdir -p "$scripts_dir"
          cp installer-mac/scripts/postinstall "$scripts_dir/postinstall"
          cp installer-mac/scripts/preinstall "$scripts_dir/preinstall"
          chmod +x "$scripts_dir/postinstall" "$scripts_dir/preinstall"
          cp installer-mac/payload/reaper_spidercrab.dylib "$scripts_dir/reaper_spidercrab.dylib"
          cp -R installer-mac/payload/frontend "$scripts_dir/frontend"

          mkdir -p installer-mac/output
          pkgbuild \
            --nopayload \
            --identifier org.quantockhills.spidercrab \
            --version "$version" \
            --scripts "$scripts_dir" \
            --install-location /tmp/spidercrab-installer-unused \
            installer-mac/output/SpidercrabInstaller.pkg

      - name: Verify the installer actually installs (real install, on this runner)
        if: ${{ inputs.make_installer }}
        run: |
          set -e
          dest="$HOME/Library/Application Support/REAPER/UserPlugins"
          reaper_dir="$HOME/Library/Application Support/REAPER"
          rm -rf "$dest"

          # Seed a minimal reaper.ini so the postinstall's OSC-device patch
          # has something real to patch, same as a machine REAPER has
          # already run on at least once.
          mkdir -p "$reaper_dir"
          cat > "$reaper_dir/reaper.ini" <<'EOF'
[reaper]
config_toolbar_h=0
csurf_cnt=1
csurf_0=SomeOtherDevice 0 9 1 1

[otherplugin]
somekey=somevalue
EOF

          installer -pkg installer-mac/output/SpidercrabInstaller.pkg -target CurrentUserHomeDirectory
          test -f "$dest/reaper_spidercrab.dylib" || { echo "dylib missing after install"; exit 1; }
          test -f "$dest/frontend/index.html" || { echo "frontend/index.html missing after install"; exit 1; }
          nm -gU "$dest/reaper_spidercrab.dylib" | grep -q ReaperPluginEntry || { echo "installed dylib doesn't export ReaperPluginEntry"; exit 1; }
          echo "Installed bundle verified at: $dest"
          ls -la "$dest"

          echo "--- reaper.ini after install ---"
          cat "$reaper_dir/reaper.ini"
          grep -qF 'OSC "spidercrab" 6 9001 "127.0.0.1" 9011 1024 10 ""' "$reaper_dir/reaper.ini" || { echo "OSC device line missing from reaper.ini"; exit 1; }
          grep -q '^csurf_cnt=2$' "$reaper_dir/reaper.ini" || { echo "csurf_cnt wasn't bumped correctly"; exit 1; }
          grep -q '^csurf_0=SomeOtherDevice 0 9 1 1$' "$reaper_dir/reaper.ini" || { echo "pre-existing csurf_0 entry was clobbered"; exit 1; }
          grep -qF '[otherplugin]' "$reaper_dir/reaper.ini" || { echo "unrelated [otherplugin] section got lost"; exit 1; }
          echo "reaper.ini OSC device registration verified"

          # Re-run the installer to confirm it doesn't duplicate the entry.
          installer -pkg installer-mac/output/SpidercrabInstaller.pkg -target CurrentUserHomeDirectory
          count=$(grep -c 'OSC "spidercrab"' "$reaper_dir/reaper.ini")
          [ "$count" -eq 1 ] || { echo "OSC device entry duplicated on reinstall (count=$count)"; exit 1; }
          echo "Re-install idempotency verified (no duplicate OSC device entry)"

      - name: Upload macOS installer
        if: ${{ inputs.make_installer }}
        uses: actions/upload-artifact@v4
        with:
          name: SpidercrabInstaller
          path: installer-mac/output/SpidercrabInstaller.pkg
